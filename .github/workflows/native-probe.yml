name: Recheck Flang 23.1.4 ARM64 DLL data import
on:
  push:
    branches: [codex/flang-23.1.4-dll-recheck]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/hdf5-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-verified Pixi
        shell: pwsh
        run: |
          $p = "$env:RUNNER_TEMP/pixi.exe"
          Invoke-WebRequest 'https://github.com/prefix-dev/pixi/releases/download/v0.83.0/pixi-aarch64-pc-windows-msvc.exe' -OutFile $p
          if ((Get-FileHash $p -Algorithm SHA256).Hash.ToLower() -ne '9d1efccf25c9006787ac707ce01590907e2a8c5d7074d81c48cfa327d1dff92e') { throw 'Pixi checksum mismatch' }
          "$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Compile and run existing DLL consumers
        shell: pwsh
        run: |
          pixi run --locked probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
